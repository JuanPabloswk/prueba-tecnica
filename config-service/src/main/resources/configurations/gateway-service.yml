server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
          - id: product-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/products/**
          - id: inventory-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/inventory/**

eureka:
  client:
    register-with-eureka: false
